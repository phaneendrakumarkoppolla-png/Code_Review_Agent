services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      FRONTEND_URL: http://localhost:5173
      DATABASE_FILE: /app/data/reviews.db
      ENABLE_LIVE_SERVICES: "false"
    volumes:
      - review-data:/app/data

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  review-data:
